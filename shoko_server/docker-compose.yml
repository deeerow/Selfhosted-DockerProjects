services:
  shoko:
    image: shokoanime/server:daily
    container_name: shoko
    labels:
      traefik.enable: true    # enabling traefik on this app
      traefik.http.routers.shoko.middlewares: auth@file   # enabling authelia security login
      traefik.http.services.shoko.loadbalancer.server.port: 8111
    volumes:
      - ./shoko_config:/home/shoko/.shoko
      - ${MEDIA_DIR:?err}:/data/media:rw
    environment:
      TZ: America/Vancouver
      PGID: ${PGID:?err}
      PUID: ${PUID:?err}
      UMASK: ${UMASK:?err}
      INSTALL_PACKAGES: libva2 libva-drm2 intel-media-va-driver-non-free ffmpeg
      EXTRA_GROUPS: 993        # stat -c '%g' /dev/dri/renderD128, on the hos
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    restart: always
    shm_size: 256m

networks:
  proxy:
    external: true
